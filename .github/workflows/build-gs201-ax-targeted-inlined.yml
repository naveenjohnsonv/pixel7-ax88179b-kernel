name: Build GS201 with inline AX88179B, autofs and dormant diagnostics

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: gs201-ax88179b-inline
  cancel-in-progress: true

jobs:
  build-gki:
    name: "GS201 GKI + inline ASIX 4.1.0 + XHCI_NO_SOFT_RETRY"
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      BUILD_RECIPE_ID: inline-asix-v3-autofs-dormant-debug
      KLEAF_CACHE_NAMESPACE: gs201-android14-6.1-kleaf-v1
      KSU_NEXT_COMMIT: 86cf3441815fe71dbc35ff6c675c3eea3f946467

    steps:
    - name: Checkout pinned WildKernels recipe
      uses: actions/checkout@v7
      with:
        repository: WildKernels/GKI_KernelSU_SUSFS
        ref: 6052906542503519cfc9f63583fc2bd8b1a56344
        fetch-depth: 1
        persist-credentials: false

    - name: Checkout this integration recipe
      uses: actions/checkout@v7
      with:
        path: build-assets
        fetch-depth: 1
        persist-credentials: false

    - name: Test config integration tooling
      shell: bash
      run: python3 -m unittest discover -s build-assets/inline-ax88179ab -p 'test_kernel_config.py' -v

    - name: Setup build environment
      uses: ./.github/actions/setup-build-environment
      with:
        version: android14-6.1
        sublevel: "145"
      env:
        BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}

    - name: Download current Android 14 / 6.1 September 2025 kernel
      uses: ./.github/actions/download-kernel
      with:
        version: android14-6.1
        android_version: android14
        kernel_version: "6.1"
        os_patch_level: "2025-09"

    - name: Record source inputs before patching
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build-provenance
        git -C kernel/common rev-parse HEAD > build-provenance/kernel-base-revision.txt
        {
          echo "integration=$(git -C build-assets rev-parse HEAD)"
          echo "wildkernels=$(git rev-parse HEAD)"
          echo "kernel=$(git -C kernel/common rev-parse HEAD)"
          echo "kernel_patches=$(git -C kernel_patches rev-parse HEAD)"
          echo "anykernel=$(git -C AnyKernel3 rev-parse HEAD)"
        } > build-provenance/initial-sources.txt

    - name: Set deterministic build timestamp
      shell: bash
      run: |
        set -euo pipefail
        echo "SOURCE_DATE_EPOCH=1757046000" >> "$GITHUB_ENV"
        echo "KBUILD_BUILD_TIMESTAMP=Fri Sep 05 04:20:00 UTC 2025" >> "$GITHUB_ENV"
        echo "GIT_COMMITTER_DATE=2025-09-05T04:20:00Z" >> "$GITHUB_ENV"
        echo "GIT_AUTHOR_DATE=2025-09-05T04:20:00Z" >> "$GITHUB_ENV"

    - name: Extract kernel metadata
      id: extract
      uses: ./.github/actions/extract-sublevel-file-name
      with:
        android_version: android14
        kernel_version: "6.1"
        sublevel: "145"
        os_patch_level: "2025-09"
        variant: TheWildJames

    - name: Apply upstream recipe kernel fixes
      uses: ./.github/actions/kernel-fixes
      with:
        version: android14-6.1
        android_version: android14
        kernel_version: "6.1"
        sublevel: ${{ steps.extract.outputs.sublevel }}
        os_patch_level: "2025-09"

    - name: Clone and integrate pinned KernelSU-Next dev-susfs
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        rm -rf KernelSU-Next
        git clone --quiet --no-checkout --depth=1 --branch dev-susfs --single-branch \
          https://github.com/pershoot/KernelSU-Next.git KernelSU-Next
        git -C KernelSU-Next fetch --quiet --depth=1 origin "$KSU_NEXT_COMMIT"
        git -C KernelSU-Next checkout --quiet --detach "$KSU_NEXT_COMMIT"
        test "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSU_NEXT_COMMIT"
        git -C KernelSU-Next rev-parse HEAD \
          > "${{ github.workspace }}/build-provenance/kernelsu-source.txt"

        ln -sfn ../../KernelSU-Next/kernel common/drivers/kernelsu
        grep -q 'obj-$(CONFIG_KSU) += kernelsu/' common/drivers/Makefile || \
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> common/drivers/Makefile
        grep -q 'source "drivers/kernelsu/Kconfig"' common/drivers/Kconfig || \
          sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' common/drivers/Kconfig

        # This revision already declares the SELinux exports through SUSFS_EXPORT.
        # The historical static.patch is obsolete and was removed by upstream.

    - name: Clone and integrate current SUSFS Android 14 / 6.1 dev
      shell: bash
      run: |
        set -euo pipefail
        susfs_repo="${{ github.workspace }}/susfs4ksu"
        kernel_tree="${{ github.workspace }}/kernel/common"
        rm -rf "$susfs_repo"
        git clone --quiet --depth=1 --branch gki-android14-6.1-dev \
          --single-branch https://gitlab.com/pershoot/susfs4ksu.git "$susfs_repo"

        cp "$susfs_repo/kernel_patches/fs/"* "$kernel_tree/fs/"
        cp "$susfs_repo/kernel_patches/include/linux/"* "$kernel_tree/include/linux/"
        patch -d "$kernel_tree" -p1 --batch --forward \
          < "$susfs_repo/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch"

    - name: Enable KernelSU and SUSFS
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y

    - name: Setup Baseband Guard
      uses: ./.github/actions/bbg

    - name: Setup networking
      uses: ./.github/actions/networking
      with:
        version: android14-6.1
        kernel_version: "6.1"
        android_version: android14
        sublevel: ${{ steps.extract.outputs.sublevel }}

    - name: Apply DroidSpaces-OSS patches
      uses: ./.github/actions/droidspaces
      with:
        version: android14-6.1
        android_version: android14
        kernel_version: "6.1"
        os_patch_level: "2025-09"
        sublevel: ${{ steps.extract.outputs.sublevel }}

    - name: Enable server and container configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_USER_NS=y
          CONFIG_IP_NF_TARGET_REJECT=y
          CONFIG_IP6_NF_TARGET_REJECT=y

    - name: Apply NTSync patches
      uses: ./.github/actions/ntsync
      with:
        version: android14-6.1
        kernel_version: "6.1"
        sublevel: ${{ steps.extract.outputs.sublevel }}

    - name: Apply ptrace patch
      uses: ./.github/actions/ptrace
      with:
        kernel_version: "6.1"

    - name: Apply Unicode fix
      uses: ./.github/actions/unicode-fix
      with:
        kernel_version: "6.1"

    - name: Setup miscellaneous configs
      uses: ./.github/actions/misc
      with:
        version: android14-6.1
        kernel_version: "6.1"
        android_version: android14
        sublevel: ${{ steps.extract.outputs.sublevel }}
        variant: TheWildJames

    - name: Apply device-specific patches
      uses: ./.github/actions/apply-device-patches
      with:
        version: android14-6.1
        kernel_version: "6.1"

    - name: Clone current official ASIX driver
      shell: bash
      run: |
        set -euo pipefail
        asix_repo="${{ github.workspace }}/asix-usb-nic-linux-driver"
        rm -rf "$asix_repo"
        git clone --quiet --depth=1 \
          https://github.com/ASIXElectronics/asix-usb-nic-linux-driver.git \
          "$asix_repo"

    - name: Apply minimized inline ASIX and target fixes
      shell: bash
      run: |
        set -euo pipefail
        assets="${{ github.workspace }}/build-assets/inline-ax88179ab"
        kernel_tree="${{ github.workspace }}/kernel/common"
        ksu_tree="${{ github.workspace }}/kernel/KernelSU-Next"
        asix_repo="${{ github.workspace }}/asix-usb-nic-linux-driver"

        python3 "$assets/apply-inline-transform.py" \
          --kernel "$kernel_tree" --asix "$asix_repo" --ksu "$ksu_tree"

    - name: Enable built-in ASIX driver
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_USB_NET_DRIVERS=y
          CONFIG_MII=m
          CONFIG_USB_NET_AX_USB_NIC=y

    - name: Apply kernel branding
      uses: ./.github/actions/apply-kernel-branding
      with:
        variant: TheWildJames
        kernel_version: "6.1"
        android_version: android14
        version: android14-6.1
        sublevel: ${{ steps.extract.outputs.sublevel }}

    - name: Remove protected exports required by upstream recipe
      uses: ./.github/actions/remove-protected-exports

    - name: Clean kernel flags
      uses: ./.github/actions/clean-kernel-flags

    - name: Apply autofs and dormant diagnostic config
      shell: bash
      run: |
        set -euo pipefail
        assets="${{ github.workspace }}/build-assets/inline-ax88179ab"
        config="${{ github.workspace }}/kernel/common/arch/arm64/configs/gki_defconfig"
        python3 "$assets/kernel-config.py" apply \
          --fragment "$assets/autofs-debug.fragment" --config "$config"
        python3 "$assets/kernel-config.py" verify \
          --fragment "$assets/autofs-debug.fragment" --config "$config"

    - name: Verify final source tree
      shell: bash
      run: |
        set -euo pipefail
        kernel_tree="${{ github.workspace }}/kernel/common"
        ksu_tree="${{ github.workspace }}/kernel/KernelSU-Next"
        driver="$kernel_tree/drivers/net/usb/ax_usb_nic"

        required_files=(
          "$driver/ax_main.c"
          "$driver/ax_main.h"
          "$driver/ax88179_178a.c"
          "$driver/ax88179a_772d.c"
          "$driver/ax_mii_compat.c"
          "$driver/ax_mii_compat.h"
          "$driver/Makefile"
        )
        for path in "${required_files[@]}"; do
          test -s "$path"
        done

        grep -Fq 'config USB_NET_AX_USB_NIC' \
          "$kernel_tree/drivers/net/usb/Kconfig"
        grep -Fq 'obj-$(CONFIG_USB_NET_AX_USB_NIC)' \
          "$kernel_tree/drivers/net/usb/Makefile"
        grep -Fq 'AX88179 handled by built-in ax_usb_nic' \
          "$kernel_tree/drivers/net/usb/ax88179_178a.c"

        grep -Fq 'AX_BCDDEVICE_ID_179A, ax88179a_info' "$driver/ax_main.c"
        test "$(grep -Fc 'AX_BCDDEVICE_ID_179A, ax88179a_info' \
          "$driver/ax_main.c")" -eq 1
        grep -Fq 'min_t(int, desc->skb_num, remaining)' "$driver/ax_main.c"
        grep -Fq 'napi_complete_done(tx_napi, work_done)' "$driver/ax_main.c"
        grep -Fq 'usb_deregister_device_driver(&ax_usb_config_driver);' \
          "$driver/ax_main.c"
        grep -Fq '#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 10, 0)' \
          "$driver/ax_main.h"
        grep -Fq 'ax_mii_ethtool_get_link_ksettings' \
          "$driver/ax_mii_compat.c"
        grep -Fq 'ax_generic_mii_ioctl' "$driver/ax_mii_compat.c"
        grep -Fq 'ax_mii_compat.o' "$driver/Makefile"
        ! grep -Fq 'EXPORT_SYMBOL(ax_' "$driver/ax_mii_compat.c"
        ! grep -REq \
          '\b(mii_nway_restart|mii_ethtool_gset|mii_ethtool_get_link_ksettings|mii_ethtool_sset|mii_ethtool_set_link_ksettings|generic_mii_ioctl)\(' \
          "$driver/ax_main.c" "$driver/ax88179_178a.c" \
          "$driver/ax88179a_772d.c"

        grep -Fq 'xhci->quirks |= XHCI_NO_SOFT_RETRY;' \
          "$kernel_tree/drivers/usb/host/xhci.c"
        grep -Fq '"xhci-hcd-exynos."' \
          "$kernel_tree/drivers/usb/host/xhci.c"
        grep -Fq 'is_init(current_cred())' \
          "$ksu_tree/kernel/feature/sucompat.c"
        ! grep -Fq 'is_init(get_current_cred())' \
          "$ksu_tree/kernel/feature/sucompat.c"

        ! grep -RqF 'usb_prefer_ax88179ab_config1' \
          "$kernel_tree/drivers/usb/core"
        ! grep -RqF 'AX88179A/B runtime PM pinned active' "$driver"
        ! grep -Fq 'CONFIG_USB_NET_AX_USB_NIC_PIN_RUNTIME_PM' \
          "$kernel_tree/ax88179ab-inline.fragment"

        grep -Fqx 'CONFIG_USB_NET_DRIVERS=y' \
          "$kernel_tree/ax88179ab-inline.fragment"
        grep -Fqx 'CONFIG_MII=m' "$kernel_tree/ax88179ab-inline.fragment"
        grep -Fqx 'CONFIG_USB_NET_AX_USB_NIC=y' \
          "$kernel_tree/ax88179ab-inline.fragment"
        grep -Fqx 'CONFIG_USB_NET_DRIVERS=y' \
          "$kernel_tree/arch/arm64/configs/gki_defconfig"
        grep -Fqx 'CONFIG_MII=m' \
          "$kernel_tree/arch/arm64/configs/gki_defconfig"
        grep -Fqx 'CONFIG_USB_NET_AX_USB_NIC=y' \
          "$kernel_tree/arch/arm64/configs/gki_defconfig"

        git -C "$kernel_tree" diff --check
        git -C "$ksu_tree" diff --check
        echo 'inline tree verification passed'

    - name: Initialize Bazel cache and config fragment
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p /home/runner/.cache/bazel
        touch "${{ github.workspace }}/wild_gki.fragment"
        echo "JAVA_HOME=" >> "$GITHUB_ENV"

    - name: Compute resolved-source build fingerprint
      id: fingerprint
      shell: bash
      run: |
        set -euo pipefail
        manifest="${{ github.workspace }}/build-provenance/build-fingerprint.txt"
        mkdir -p "$(dirname "$manifest")"
        kernel_base="$(cat build-provenance/kernel-base-revision.txt)"
        git -C kernel/common diff --binary --no-ext-diff "$kernel_base" \
          > build-provenance/kernel-integration.patch

        {
          echo "recipe=${BUILD_RECIPE_ID}"
          echo "integration=$(git -C build-assets rev-parse HEAD)"
          sha256sum build-assets/inline-ax88179ab/autofs-debug.fragment
          echo "kernel-base=$kernel_base"
          echo "wildkernels=$(git rev-parse HEAD)"
          echo "kernel=$(git -C kernel/common rev-parse HEAD)"
          echo "ksu=$(git -C kernel/KernelSU-Next rev-parse HEAD)"
          echo "susfs=$(git -C susfs4ksu rev-parse HEAD)"
          echo "asix=$(git -C asix-usb-nic-linux-driver rev-parse HEAD)"
          echo "droidspaces=$(git -C Droidspaces-OSS rev-parse HEAD)"
          echo "bbg=${BBG_COMMIT:-unknown}"
          echo "target=android14-6.1.145-2025-09-TheWildJames"
          git -C kernel/common diff --binary --no-ext-diff HEAD
          git -C kernel/KernelSU-Next diff --binary --no-ext-diff HEAD
          while IFS= read -r -d '' file; do
            printf 'untracked=%s\n' "$file"
            sha256sum "kernel/common/$file"
          done < <(git -C kernel/common ls-files --others --exclude-standard -z | sort -z)
        } > "$manifest"

        fingerprint="$(sha256sum "$manifest" | awk '{print substr($1,1,32)}')"
        echo "value=$fingerprint" >> "$GITHUB_OUTPUT"
        echo "Build fingerprint: $fingerprint"

    - name: Restore exact verified build outputs
      id: image-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/compiled-output
        key: kernel-inline-output-v5-${{ steps.fingerprint.outputs.value }}

    - name: Free disk space for compilation
      if: steps.image-cache.outputs.cache-hit != 'true'
      uses: endersonmenezes/free-disk-space@v3
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
        rm_cmd: rmz
        rmz_version: "3.1.1"
        testing: false

    - name: Restore incremental Kleaf output cache
      id: kleaf-cache
      if: steps.image-cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/kernel/out/cache
        key: kleaf-out-${{ env.KLEAF_CACHE_NAMESPACE }}-${{ runner.os }}-${{ steps.fingerprint.outputs.value }}
        restore-keys: |
          kleaf-out-${{ env.KLEAF_CACHE_NAMESPACE }}-${{ runner.os }}-

    - name: Setup swap for compilation
      if: steps.image-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        swap_file="$RUNNER_TEMP/kernel-build.swap"
        swap_size_gib=16
        swap_size_bytes=$((swap_size_gib * 1024 * 1024 * 1024))
        available_bytes=$(df --output=avail -B1 "$RUNNER_TEMP" | tail -n 1)

        if (( available_bytes < swap_size_bytes )); then
          echo "Need ${swap_size_gib} GiB for swap; only ${available_bytes} bytes available" >&2
          exit 1
        fi

        cleanup_failed_swap() {
          sudo swapoff "$swap_file" 2>/dev/null || true
          sudo rm -f "$swap_file"
        }
        trap cleanup_failed_swap ERR

        sudo fallocate -l "${swap_size_gib}G" "$swap_file"
        sudo chmod 600 "$swap_file"
        sudo mkswap "$swap_file"
        sudo swapon "$swap_file"
        swapon --show
        free -h

        trap - ERR

    - name: Build normal kernel Image
      if: steps.image-cache.outputs.cache-hit != 'true'
      env:
        SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
        JAVA_HOME: ""
      uses: ./.github/actions/build-kernel
      with:
        version: android14-6.1
        page_size: "4k"

    - name: Stage freshly compiled outputs
      if: steps.image-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        source_dir="${{ github.workspace }}/kernel/bazel-bin/common/kernel_aarch64"
        output_dir="${{ github.workspace }}/compiled-output"
        mkdir -p "$output_dir"
        cp "${{ github.workspace }}/AnyKernel3/Image" "$output_dir/Image"
        cp "$source_dir/mii.ko" "$output_dir/mii.ko"
        cp "$source_dir/ax88179_178a.ko" "$output_dir/ax88179_178a.ko"
        cp "$source_dir/System.map" "$output_dir/System.map"
        cp "$source_dir/vmlinux" "$output_dir/vmlinux"

    - name: Restore cached Image into build output
      if: steps.image-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        set -euo pipefail
        cp "${{ github.workspace }}/compiled-output/Image" \
          "${{ github.workspace }}/AnyKernel3/Image"

    - name: Verify compiled Image
      shell: bash
      run: |
        set -euo pipefail
        kernel_tree="${{ github.workspace }}/kernel/common"
        image="${{ github.workspace }}/AnyKernel3/Image"
        output_dir="${{ github.workspace }}/compiled-output"
        config="$(mktemp)"
        image_strings="$(mktemp)"
        trap 'rm -f "$config" "$image_strings"' EXIT

        test -s "$image"
        "$kernel_tree/scripts/extract-ikconfig" "$image" > "$config"
        cp "$config" "$output_dir/kernel.config"
        python3 "${{ github.workspace }}/build-assets/inline-ax88179ab/kernel-config.py" verify \
          --fragment "${{ github.workspace }}/build-assets/inline-ax88179ab/autofs-debug.fragment" \
          --config "$config"
        for option in USER_NS IP_NF_TARGET_REJECT IP6_NF_TARGET_REJECT DEBUG_INFO_BTF BPF_EVENTS TRACE_MMIO_ACCESS KSU KSU_SUSFS; do
          grep -Fqx "CONFIG_${option}=y" "$config"
        done
        grep -Fqx 'CONFIG_USB_NET_DRIVERS=y' "$config"
        grep -Fqx 'CONFIG_MII=m' "$config"
        grep -Fqx 'CONFIG_USB_NET_AX_USB_NIC=y' "$config"
        ! grep -Fq 'CONFIG_USB_NET_AX_USB_NIC_PIN_RUNTIME_PM' "$config"

        strings "$image" > "$image_strings"
        grep -Fq 'ASIX AX88179B_179A_772E_772D USB Ethernet Controller' \
          "$image_strings"
        grep -Fq 'ax_usb_nic' "$image_strings"
        grep -Fq 'xhci-hcd-exynos.' "$image_strings"
        ! grep -Fq 'AX88179A/B runtime PM pinned active' "$image_strings"
        ! grep -Fq 'selecting ASIX AX88179A/B vendor configuration 1' \
          "$image_strings"

        mii_module="$output_dir/mii.ko"
        stock_ax_module="$output_dir/ax88179_178a.ko"
        system_map="$output_dir/System.map"
        test -s "$mii_module"
        test -s "$stock_ax_module"
        test -s "$system_map"
        test -s "$output_dir/vmlinux"
        readelf -SW "$output_dir/vmlinux" > "$output_dir/vmlinux-sections.txt"
        grep -Eq '[[:space:]]\.BTF[[:space:]]' "$output_dir/vmlinux-sections.txt"
        modinfo "$mii_module" | grep -Eq '^name:[[:space:]]+mii$'
        ! modinfo "$stock_ax_module" | \
          grep -Eiq 'alias:.*v00000B95p00001790'
        grep -Eq ' T ax_mii_nway_restart$' "$system_map"
        grep -Eq ' T ax_generic_mii_ioctl$' "$system_map"
        ! grep -Eq ' T (mii_nway_restart|generic_mii_ioctl)$' "$system_map"

        echo 'compiled outputs contain collision-free inline ASIX and Exynos xHCI fix'

    - name: Save verified build outputs
      if: steps.image-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/compiled-output
        key: kernel-inline-output-v5-${{ steps.fingerprint.outputs.value }}

    - name: Create flashable AnyKernel3 ZIP
      shell: bash
      run: |
        set -euo pipefail
        anykernel="${{ github.workspace }}/AnyKernel3"
        release="${{ github.workspace }}/release"
        package_name="${{ steps.extract.outputs.file_name }}-AX88179B-INLINE-AnyKernel3.zip"
        package="$release/$package_name"
        mkdir -p "$release"

        test -s "$anykernel/Image"
        test -s "$anykernel/anykernel.sh"
        test -s "$anykernel/META-INF/com/google/android/update-binary"
        test -s "$anykernel/tools/ak3-core.sh"
        test -s "$anykernel/tools/magiskboot"
        rm -f "$package" "$package.sha256"

        (
          cd "$anykernel"
          zip -r -q -9 "$package" . \
            -x '.git' '.git/*' '.github' '.github/*' \
               '.gitattributes' '.gitignore'
        )

        unzip -tq "$package"
        package_files="$(zipinfo -1 "$package")"
        grep -Fxq 'Image' <<< "$package_files"
        grep -Fxq 'anykernel.sh' <<< "$package_files"
        grep -Fxq 'META-INF/com/google/android/update-binary' \
          <<< "$package_files"
        grep -Fxq 'tools/ak3-core.sh' <<< "$package_files"
        grep -Fxq 'tools/magiskboot' <<< "$package_files"
        ! grep -Eq '^\.(git|github)(/|$)' <<< "$package_files"
        unzip -p "$package" anykernel.sh | grep -Fq 'block=boot'

        (
          cd "$release"
          sha256sum "$package_name" > "$package_name.sha256"
        )
        cat "$package.sha256"

    - name: Preserve resolved source and integration evidence
      shell: bash
      run: |
        set -euo pipefail
        evidence="${{ github.workspace }}/inline-evidence"
        kernel_tree="${{ github.workspace }}/kernel/common"
        ksu_tree="${{ github.workspace }}/kernel/KernelSU-Next"
        image="${{ github.workspace }}/AnyKernel3/Image"
        mkdir -p "$evidence"

        {
          echo "integration $(git -C build-assets rev-parse HEAD)"
          echo "wildkernels $(git rev-parse HEAD)"
          echo "kernel $(git -C kernel/common rev-parse HEAD)"
          echo "ksu $(git -C kernel/KernelSU-Next rev-parse HEAD)"
          echo "susfs $(git -C susfs4ksu rev-parse HEAD)"
          echo "asix $(git -C asix-usb-nic-linux-driver rev-parse HEAD)"
          echo "anykernel $(git -C AnyKernel3 rev-parse HEAD)"
          echo "droidspaces $(git -C Droidspaces-OSS rev-parse HEAD)"
          echo "bbg ${BBG_COMMIT:-unknown}"
          echo "fingerprint ${{ steps.fingerprint.outputs.value }}"
        } > "$evidence/resolved-sources.txt"

        git -C "$kernel_tree" diff --binary --no-ext-diff HEAD \
          > "$evidence/kernel.diff"
        git -C "$ksu_tree" diff --binary --no-ext-diff HEAD \
          > "$evidence/kernelsu.diff"
        cp "$kernel_tree/ax88179ab-inline.fragment" "$evidence/"
        cp build-assets/inline-ax88179ab/autofs-debug.fragment "$evidence/"
        cp compiled-output/kernel.config "$evidence/"
        cp compiled-output/vmlinux-sections.txt "$evidence/"
        grep -E \
          '^(CONFIG_USB_NET_DRIVERS|CONFIG_MII|CONFIG_USB_NET_AX_USB_NIC)=' \
          "$kernel_tree/arch/arm64/configs/gki_defconfig" \
          > "$evidence/inline-config.txt"
        sha256sum \
          "$image" \
          "${{ github.workspace }}/compiled-output/mii.ko" \
          "${{ github.workspace }}/compiled-output/ax88179_178a.ko" \
          "${{ github.workspace }}/compiled-output/System.map" \
          "${{ github.workspace }}/compiled-output/vmlinux" \
          "${{ github.workspace }}/compiled-output/kernel.config" \
          > "$evidence/compiled-output-sha256.txt"
        modinfo "${{ github.workspace }}/compiled-output/mii.ko" \
          > "$evidence/mii-modinfo.txt"
        modinfo "${{ github.workspace }}/compiled-output/ax88179_178a.ko" \
          > "$evidence/stock-ax88179-modinfo.txt"
        cp "${{ github.workspace }}"/release/*.sha256 "$evidence/"
        git -C "$kernel_tree" status --short > "$evidence/kernel-status.txt"

    - name: Upload flashable AnyKernel3 ZIP
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.extract.outputs.file_name }}-AX88179B-INLINE-AnyKernel3
        path: |
          ${{ github.workspace }}/release/*.zip
          ${{ github.workspace }}/release/*.zip.sha256
        if-no-files-found: error
        compression-level: 0
        retention-days: 14

    - name: Upload integration evidence
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.extract.outputs.file_name }}-AX88179B-INLINE-evidence
        path: ${{ github.workspace }}/inline-evidence/**
        if-no-files-found: error
        compression-level: 9
        retention-days: 14

    - name: Upload kernel debug artifacts for recorder qualification
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.extract.outputs.file_name }}-AX88179B-INLINE-debug
        path: |
          ${{ github.workspace }}/compiled-output/vmlinux
          ${{ github.workspace }}/compiled-output/System.map
          ${{ github.workspace }}/compiled-output/kernel.config
        if-no-files-found: error
        compression-level: 6
        retention-days: 30

    - name: Upload source provenance even on failure
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: GS201-inline-source-provenance-${{ github.run_id }}
        path: ${{ github.workspace }}/build-provenance/**
        if-no-files-found: warn
        compression-level: 9
        retention-days: 90

    - name: Report incremental Kleaf output cache
      if: steps.image-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        cache_dir="${{ github.workspace }}/kernel/out/cache"
        test -d "$cache_dir"
        du -sh "$cache_dir"

    - name: Save incremental Kleaf output cache
      if: success() && steps.image-cache.outputs.cache-hit != 'true' && steps.kleaf-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/kernel/out/cache
        key: ${{ steps.kleaf-cache.outputs.cache-primary-key }}
