name: Build pinned r5 TheWildJames AX88179B
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

concurrency:
  group: thewildjames-r5-ax88179b-no-susfs
  cancel-in-progress: false

jobs:
  build-gki:
    name: "6.1.145-android14-2025-09-TheWildJames + AX88179B (No SUSFS)"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    # This workflow may live in an otherwise empty personal repository.
    # Check out the complete upstream r5 source tree so every repository-local
    # action used below is present under .github/actions.
    - name: Checkout pinned WildKernels r5 source
      uses: actions/checkout@v5
      with:
        repository: WildKernels/GKI_KernelSU_SUSFS
        ref: 705c7fc281572e8759eaaaec8b47ec579443fa08
        fetch-depth: 1
        persist-credentials: false

    - name: Verify pinned source and required local actions
      shell: bash
      run: |
        set -euo pipefail
        EXPECTED_BASE="705c7fc281572e8759eaaaec8b47ec579443fa08"
        ACTUAL_BASE="$(git rev-parse HEAD)"

        echo "Expected upstream commit: $EXPECTED_BASE"
        echo "Checked-out commit:       $ACTUAL_BASE"
        test "$ACTUAL_BASE" = "$EXPECTED_BASE"

        required_actions=(
          setup-build-environment
          download-kernel
          extract-sublevel-file-name
          kernel-fixes
          kernelsu
          bbg
          networking
          droidspaces
          misc
          apply-device-patches
          apply-kernel-branding
          remove-protected-exports
          clean-kernel-flags
          scan-patch-rejects
          cache-setup
          cache-restore
          cache-save
          cache-stats
          build-kernel
        )

        for action in "${required_actions[@]}"; do
          test -f ".github/actions/$action/action.yml" || {
            echo "Missing local action: .github/actions/$action/action.yml" >&2
            exit 1
          }
        done

        test "$(jq -r '.kernelsu.dev' .github/config/commits.json)" = \
          "5a4a71874caaad06aa126f761c93391de1d32361"

    - name: 🧹 Emergency Disk Cleanup
      if: false
      uses: ./.github/actions/disk-cleanup

    - name: Free Disk Space
      uses: endersonmenezes/free-disk-space@v3  # Use @main for latest, @v3 for stable
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
        rm_cmd: "rmz"  # Use 'rmz' for faster deletion (default: 'rm')
        rmz_version: "3.1.1"  # Required when rm_cmd is 'rmz'
        testing: false

    - name: Setup more Swap (for LTO)
      uses: thejerrybao/setup-swap-space@v1   # or pierotofy/set-swap-space
      with:
        swap-size-gb: 16          # 10-24 GB is common for heavy LTO
        # swap-space-path: /mnt/swapfile   # optional

    - name: Setup Build Environment
      uses: ./.github/actions/setup-build-environment
      env:
        BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}
          
    - name: Download Kernel Repository
      uses: ./.github/actions/download-kernel
      with:
        version: android14-6.1
        android_version: android14
        kernel_version: "6.1"
        os_patch_level: "2025-09"
        use_repo: false

    - name: Set Build Timestamp from Kernel Commit
      shell: bash
      run: |
        set -x
        # Hardcode the build timestamp to the 5th day of the patch level
        # at 04:20 UTC, using the existing timestamp formats expected by the build.
        OS_PATCH_LEVEL_INPUT="2025-09"
        if [[ "$OS_PATCH_LEVEL_INPUT" == lts* ]]; then
          if [[ "$OS_PATCH_LEVEL_INPUT" =~ ^lts-([0-9]{2})$ ]]; then
            OS_PATCH_LEVEL_YM="$(date -u +%Y)-${BASH_REMATCH[1]}"
          else
            OS_PATCH_LEVEL_YM="$(date -u +%Y-%m)"
          fi
        else
          OS_PATCH_LEVEL_YM="$OS_PATCH_LEVEL_INPUT"
        fi
        FIXED_BUILD_DATE="${OS_PATCH_LEVEL_YM}-05 04:20:00 UTC"
        SOURCE_DATE_EPOCH=$(date -u -d "$FIXED_BUILD_DATE" +%s)
        echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> $GITHUB_ENV
        KBUILD_TS=$(date -u -d @${SOURCE_DATE_EPOCH} '+%a %b %d %H:%M:%S UTC %Y')
        echo "KBUILD_BUILD_TIMESTAMP=${KBUILD_TS}" >> $GITHUB_ENV
        # Keep git metadata aligned with the same fixed timestamp.
        GIT_DATE=$(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%dT%H:%M:%SZ')
        echo "GIT_COMMITTER_DATE=${GIT_DATE}" >> $GITHUB_ENV
        echo "GIT_AUTHOR_DATE=${GIT_DATE}" >> $GITHUB_ENV
        echo "Build timestamp set to: $(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%d %H:%M:%S UTC') (epoch: $SOURCE_DATE_EPOCH)"

    - name: Extract Sublevel and Set File Name
      id: extract
      uses: ./.github/actions/extract-sublevel-file-name
      with:
        android_version: android14
        kernel_version: "6.1"
        sublevel: "145"
        os_patch_level: "2025-09"
        variant: TheWildJames

    - name: Kernel Fixes
      uses: ./.github/actions/kernel-fixes
      with:
        version: android14-6.1
        android_version: android14
        kernel_version: "6.1"
        sublevel: ${{ steps.extract.outputs.sublevel }}
        os_patch_level: "2025-09"

    - name: Apply AX88179B USB stability quirks
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path
        import re

        path = Path("drivers/usb/core/quirks.c")
        text = path.read_text(encoding="utf-8")
        pattern = re.compile(
            r"\{\s*USB_DEVICE\(0x0b95,\s*0x1790\).*?\},",
            re.DOTALL,
        )
        flags = ("USB_QUIRK_RESET_RESUME", "USB_QUIRK_NO_LPM")
        entry = (
            "\t/* ASIX AX88179B USB 3.0 Gigabit Ethernet */\n"
            "\t{ USB_DEVICE(0x0b95, 0x1790), .driver_info =\n"
            "\t\tUSB_QUIRK_RESET_RESUME | USB_QUIRK_NO_LPM },\n"
        )

        matches = list(pattern.finditer(text))
        if matches:
            if len(matches) != 1:
                raise SystemExit(
                    f"expected one AX88179B entry, found {len(matches)}"
                )
            existing = matches[0].group(0)
            missing = [flag for flag in flags if flag not in existing]
            if missing:
                raise SystemExit(
                    "existing AX88179B entry lacks: " + ", ".join(missing)
                )
            print("AX88179B quirk already present and correct")
        else:
            anchors = (
                "\t/* Realtek hub in Dell WD19 (Type-C) */",
                "\t{ USB_DEVICE(0x0bda, 0x0487)",
                "\t/* Generic RTL8153 based ethernet adapters */",
            )
            anchor = next((item for item in anchors if item in text), None)
            if anchor is None:
                raise SystemExit("AX88179B insertion anchor not found")
            text = text.replace(anchor, entry + anchor, 1)
            path.write_text(text, encoding="utf-8")
            print("Added AX88179B RESET_RESUME + NO_LPM quirks")

        final = path.read_text(encoding="utf-8")
        match = pattern.search(final)
        if not match or any(flag not in match.group(0) for flag in flags):
            raise SystemExit("AX88179B quirk verification failed")
        print(match.group(0))
        PY

    - name: Setup KernelSU-Next
      uses: ./.github/actions/kernelsu
      with:
        use_latest_commits: false

    - name: Verify pinned KernelSU Next and SUSFS exclusion
      shell: bash
      run: |
        set -euo pipefail

        EXPECTED_KSU="$(jq -r '.kernelsu.dev' .github/config/commits.json)"
        ACTUAL_KSU="$(git -C kernel/KernelSU-Next rev-parse HEAD)"
        test "$ACTUAL_KSU" = "$EXPECTED_KSU"

        # The dedicated SUSFS action must not have run or created its source tree.
        test ! -e "${{ github.workspace }}/susfs4ksu"

        echo "KernelSU Next commit: $ACTUAL_KSU"
        echo "SUSFS: not included"

    - name: Baseband Guard
      uses: ./.github/actions/bbg

    - name: Setup Networking
      uses: ./.github/actions/networking
      with:
        version: android14-6.1
        kernel_version: "6.1"
        android_version: android14

    - name: DroidSpaces-OSS Patches
      uses: ./.github/actions/droidspaces
      with:
        version: android14-6.1
        kernel_version: "6.1"

    - name: Setup Misc Configs
      uses: ./.github/actions/misc
      with:
        version: android14-6.1
        kernel_version: "6.1"
        android_version: android14
        sublevel: ${{ steps.extract.outputs.sublevel }}
        variant: TheWildJames

    - name: Apply Device-Specific Patches
      uses: ./.github/actions/apply-device-patches
      with:
        version: android14-6.1
        kernel_version: "6.1"

    - name: Apply ABI Compare Bypass
      if: false
      working-directory: ${{ github.workspace }}/kernel
      run: |
        # ABI compare bypass per kernel/android version
        # Edit each block as needed per version
        if [[ "$ANDROID_VERSION" == "android12" && "$KERNEL_VERSION" == "5.10" ]]; then
          sed -i 's/^\s*exit 1$/    echo "Who Cares? Bypassing Now!"/' build/abi/compare_to_symbol_list
        elif [[ "$ANDROID_VERSION" == "android13" && "$KERNEL_VERSION" == "5.10" ]]; then
          sed -i 's/^\s*exit 1$/    echo "Who Cares? Bypassing Now!"/' build/kernel/abi/compare_to_symbol_list
        elif [[ "$ANDROID_VERSION" == "android13" && "$KERNEL_VERSION" == "5.15" ]]; then
          sed -i 's/^\s*exit 1$/    echo "Who Cares? Bypassing Now!"/' build/kernel/abi/compare_to_symbol_list
        elif [[ "$ANDROID_VERSION" == "android14" && "$KERNEL_VERSION" == "5.15" ]]; then
          perl -i -pe 's/^(\s*)return 1$/$1print("Who Cares? Bypassing Now!")\n$1return 0/g if /if missing_symbols:/../return 1/' build/kernel/abi/check_buildtime_symbol_protection.py
        elif [[ "$ANDROID_VERSION" == "android14" && "$KERNEL_VERSION" == "6.1" ]]; then
          perl -i -pe 's/^(\s*)return 1$/$1print("Who Cares? Bypassing Now!")\n$1return 0/g if /if missing_symbols:/../return 1/' build/kernel/abi/check_buildtime_symbol_protection.py
        elif [[ "$ANDROID_VERSION" == "android15" && "$KERNEL_VERSION" == "6.6" ]]; then
          perl -i -pe 's/^(\s*)return 1$/$1print("Who Cares? Bypassing Now!")\n$1return 0/g if /if missing_symbols:/../return 1/' build/kernel/abi/check_buildtime_symbol_protection.py
        fi

    - name: Apply Kernel Branding
      uses: ./.github/actions/apply-kernel-branding
      with:
        variant: TheWildJames
        kernel_version: "6.1"
        android_version: android14
        version: android14-6.1
        sublevel: ${{ steps.extract.outputs.sublevel }}

    - name: Remove Protected Exports
      uses: ./.github/actions/remove-protected-exports

    - name: Clean Kernel Flags
      uses: ./.github/actions/clean-kernel-flags

    - name: Scan and collect patch rejects
      id: scan
      if: ${{ always() }}
      uses: ./.github/actions/scan-patch-rejects
        
    - name: Upload Rejects
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.extract.outputs.file_name }}-Rejects
        path: patch-rejects/
        if-no-files-found: ignore
        compression-level: 9

    - name: 'Setup Cache and Build Environment'
      uses: ./.github/actions/cache-setup
      with:
        version: android14-6.1
        android_version: android14
        kernel_version: "6.1"
        sublevel: ${{ steps.extract.outputs.sublevel }}

    - name: Restore ccache
      id: restore-ccache
      continue-on-error: true
      if: false
      uses: ./.github/actions/cache-restore
      with:
        cache_path: /home/runner/.ccache
        cache_key: android14-6.1.${{ steps.extract.outputs.sublevel }}-2025-09
        cache_bucket: ccache-cache
        restore_keys: |
          android14-6.1.${{ steps.extract.outputs.sublevel }}-

    - name: Restore lto-cache (ccache versions)
      id: restore-lto-ccache
      continue-on-error: true
      if: false
      uses: ./.github/actions/cache-restore
      with:
        cache_path: /home/runner/.ld_cache
        cache_key: android14-6.1.${{ steps.extract.outputs.sublevel }}-2025-09
        cache_bucket: lto-cache
        restore_keys: |
          android14-6.1.${{ steps.extract.outputs.sublevel }}-

    - name: Restore bazel-cache
      id: restore-bazel
      continue-on-error: true
      uses: ./.github/actions/cache-restore
      with:
        cache_path: /home/runner/.cache/bazel
        cache_key: android14-6.1.${{ steps.extract.outputs.sublevel }}-2025-09
        cache_bucket: bazel-cache
        restore_keys: |
          android14-6.1.${{ steps.extract.outputs.sublevel }}-

    - name: Check cache hit
      run: |
        echo "Cache restore status:"
        CCACHE_HIT="${{ steps.restore-ccache.outputs.cache-hit || 'skipped' }}"
        LTO_CCACHE_HIT="${{ steps.restore-lto-ccache.outputs.cache-hit || 'skipped' }}"
        BAZEL_HIT="${{ steps.restore-bazel.outputs.cache-hit || 'skipped' }}"
        LTO_BAZEL_HIT="skipped"
        echo "  ccache: $CCACHE_HIT"
        echo "  lto (ccache versions): $LTO_CCACHE_HIT"
        echo "  bazel: $BAZEL_HIT"
        echo "  lto (bazel versions): $LTO_BAZEL_HIT"

    - name: Get Cache Stats
      uses: ./.github/actions/cache-stats
      with:
        clear_stats: true

    - name: Initialize Config Fragment
      run: touch "${{ github.workspace }}/wild_gki.fragment"

    - name: Build Normal Kernel
      env:
        SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
      uses: ./.github/actions/build-kernel
      with:
        version: android14-6.1
        bypass: false

    - name: Get Cache Stats
      uses: ./.github/actions/cache-stats
      with:
        clear_stats: false

    - name: Save ccache
      continue-on-error: true
      uses: ./.github/actions/cache-save
      if: false
      with:
        cache_path: /home/runner/.ccache
        cache_key: android14-6.1.${{ steps.extract.outputs.sublevel }}-2025-09
        cache_bucket: "ccache-cache"
        compression_level: 9
        github_token: ${{ secrets.MY_GITHUB_TOKEN }}

    - name: Save lto-cache
      continue-on-error: true
      uses: ./.github/actions/cache-save
      if: false
      with:
        cache_path: /home/runner/.ld_cache
        cache_key: android14-6.1.${{ steps.extract.outputs.sublevel }}-2025-09
        cache_bucket: "lto-cache"
        compression_level: 9
        github_token: ${{ secrets.MY_GITHUB_TOKEN }}

    - name: Save bazel-cache
      continue-on-error: true
      uses: ./.github/actions/cache-save
      with:
        cache_path: /home/runner/.cache/bazel
        cache_key: android14-6.1.${{ steps.extract.outputs.sublevel }}-2025-09
        cache_bucket: "bazel-cache"
        compression_level: 9
        github_token: ${{ secrets.MY_GITHUB_TOKEN }}

    - name: Build Bypass Kernel
      env:
        SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
      uses: ./.github/actions/build-kernel
      with:
        bypass: true
        version: android14-6.1

    - name: Verify pinned AX88179B build
      shell: bash
      run: |
        set -euo pipefail

        test -s "${{ github.workspace }}/AnyKernel3/Image"
        test -s "${{ github.workspace }}/AnyKernel3/Bypass-Image"

        VERSION=$(strings "${{ github.workspace }}/AnyKernel3/Image" | grep -m1 '^Linux version ')
        echo "$VERSION"
        grep -q 'Linux version 6.1.145-android14-Wild' <<<"$VERSION"

        CONFIG_OUT="${{ runner.temp }}/wildkernel.config"
        "${{ github.workspace }}/kernel/common/scripts/extract-ikconfig" \
          "${{ github.workspace }}/AnyKernel3/Image" > "$CONFIG_OUT"

        required_configs=(
          'CONFIG_KSU=y'
          'CONFIG_BBG=y'
          'CONFIG_SYSVIPC=y'
          'CONFIG_IPC_NS=y'
          'CONFIG_PID_NS=y'
          'CONFIG_DEVTMPFS=y'
          'CONFIG_TCP_CONG_BBR=y'
          'CONFIG_DEFAULT_BBR=y'
          'CONFIG_DEFAULT_TCP_CONG="bbr"'
          'CONFIG_NET_SCH_CAKE=y'
          'CONFIG_WIREGUARD=y'
          'CONFIG_IP_SET=y'
          'CONFIG_IP6_NF_NAT=y'
          'CONFIG_TMPFS_XATTR=y'
          'CONFIG_TMPFS_POSIX_ACL=y'
          'CONFIG_OVERLAY_FS=y'
          'CONFIG_USB_NET_AX88179_178A=m'
        )

        for config in "${required_configs[@]}"; do
          grep -Fqx "$config" "$CONFIG_OUT" || {
            echo "Missing expected config: $config" >&2
            exit 1
          }
        done

        if grep -Eq '^CONFIG_KSU_SUSFS(=|_)' "$CONFIG_OUT"; then
          echo "SUSFS configuration unexpectedly present:" >&2
          grep -E '^CONFIG_KSU_SUSFS(=|_)' "$CONFIG_OUT" >&2
          exit 1
        fi

        grep -A3 -B1 'USB_DEVICE(0x0b95, 0x1790)' \
          "${{ github.workspace }}/kernel/common/drivers/usb/core/quirks.c"

        FULL_KSU_COMMIT="$(git -C "${{ github.workspace }}/kernel/KernelSU-Next" rev-parse HEAD)"

        cat > "${{ github.workspace }}/AnyKernel3/AX88179B-BUILD.txt" <<EOF
        Base workflow commit: 705c7fc281572e8759eaaaec8b47ec579443fa08 (r5)
        Kernel target: 6.1.145-android14-2025-09-TheWildJames
        Feature set: KernelSU Next + BBG + Networking + DroidSpaces (SUSFS excluded)
        KernelSU implementation: KernelSU Next
        KernelSU Next commit: ${FULL_KSU_COMMIT}
        KernelSU version code: ${KSU_VERSION:-unknown}
        KernelSU tag: ${KSU_GIT_TAG:-unknown}
        Required manager: KernelSU Next Manager (not original KernelSU Manager)
        SUSFS: not included
        Device quirk: 0b95:1790 RESET_RESUME + NO_LPM
        Runtime equivalent: usbcore.quirks=0b95:1790:bk
        EOF

        sha256sum \
          "${{ github.workspace }}/AnyKernel3/Image" \
          "${{ github.workspace }}/AnyKernel3/Bypass-Image" | \
          tee "${{ github.workspace }}/AnyKernel3/AX88179B-SHA256.txt"

    - name: Package flashable AX88179B ZIP
      shell: bash
      working-directory: ${{ github.workspace }}/AnyKernel3
      run: |
        set -euo pipefail
        ZIP_NAME="${{ steps.extract.outputs.file_name }}-AX88179B-NoSUSFS-AnyKernel3.zip"
        zip -r9 "${{ github.workspace }}/$ZIP_NAME" . \
          -x '.git/*' '.github/*' README.md
        echo "AX_ZIP=${{ github.workspace }}/$ZIP_NAME" >> "$GITHUB_ENV"

    - name: Upload flashable AX88179B ZIP
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.extract.outputs.file_name }}-AX88179B-NoSUSFS-Flashable
        path: ${{ env.AX_ZIP }}
        if-no-files-found: error
        compression-level: 0

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.extract.outputs.file_name }}-NoSUSFS-AnyKernel3
        path: ${{ github.workspace }}/AnyKernel3/**
        if-no-files-found: ignore
        compression-level: 9
