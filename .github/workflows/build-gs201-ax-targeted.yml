name: Build latest TheWildJames AX88179B
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build-gki:
    name: "6.1.145-android14-2025-09-TheWildJames + AX88179B"
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        repository: WildKernels/GKI_KernelSU_SUSFS

    - name: 🧹 Emergency Disk Cleanup
      if: false
      uses: ./.github/actions/disk-cleanup

    - name: Free Disk Space
      if: true
      uses: endersonmenezes/free-disk-space@v3  # Use @main for latest, @v3 for stable
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
        rm_cmd: "rmz"  # Use 'rmz' for faster deletion (default: 'rm')
        rmz_version: "3.1.1"  # Required when rm_cmd is 'rmz'
        testing: false

    - name: Setup more Swap (for LTO)
      uses: thejerrybao/setup-swap-space@v1   # or pierotofy/set-swap-space
      with:
        swap-size-gb: 16          # 10-24 GB is common for heavy LTO
        # swap-space-path: /mnt/swapfile   # optional

    - name: Setup Build Environment
      uses: ./.github/actions/setup-build-environment
      env:
        BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}
          
    - name: Download Kernel Repository
      uses: ./.github/actions/download-kernel
      with:
        version: android14-6.1
        android_version: android14
        kernel_version: "6.1"
        os_patch_level: "2025-09"

    - name: Build FUSE-BPF Userspace Daemon (Issue #211)
      if: false
      uses: ./.github/actions/fuse-bpf
      with:
        version: android14-6.1
        kernel_version: "6.1"
        android_version: android14

    - name: Set Build Timestamp from Kernel Commit
      shell: bash
      run: |
        set -x
        # Hardcode the build timestamp to the 5th day of the patch level
        # at 04:20 UTC, using the existing timestamp formats expected by the build.
        OS_PATCH_LEVEL_INPUT="2025-09"
        if [[ "$OS_PATCH_LEVEL_INPUT" == lts* ]]; then
          if [[ "$OS_PATCH_LEVEL_INPUT" =~ ^lts-([0-9]{2})$ ]]; then
            OS_PATCH_LEVEL_YM="$(date -u +%Y)-${BASH_REMATCH[1]}"
          else
            OS_PATCH_LEVEL_YM="$(date -u +%Y-%m)"
          fi
        else
          OS_PATCH_LEVEL_YM="$OS_PATCH_LEVEL_INPUT"
        fi
        FIXED_BUILD_DATE="${OS_PATCH_LEVEL_YM}-05 04:20:00 UTC"
        SOURCE_DATE_EPOCH=$(date -u -d "$FIXED_BUILD_DATE" +%s)
        echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> $GITHUB_ENV
        KBUILD_TS=$(date -u -d @${SOURCE_DATE_EPOCH} '+%a %b %d %H:%M:%S UTC %Y')
        echo "KBUILD_BUILD_TIMESTAMP=${KBUILD_TS}" >> $GITHUB_ENV
        # Keep git metadata aligned with the same fixed timestamp.
        GIT_DATE=$(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%dT%H:%M:%SZ')
        echo "GIT_COMMITTER_DATE=${GIT_DATE}" >> $GITHUB_ENV
        echo "GIT_AUTHOR_DATE=${GIT_DATE}" >> $GITHUB_ENV
        echo "Build timestamp set to: $(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%d %H:%M:%S UTC') (epoch: $SOURCE_DATE_EPOCH)"

    - name: Extract Sublevel and Set File Name
      id: extract
      uses: ./.github/actions/extract-sublevel-file-name
      with:
        android_version: android14
        kernel_version: "6.1"
        sublevel: "145"
        os_patch_level: "2025-09"
        variant: TheWildJames

    - name: Kernel Fixes
      uses: ./.github/actions/kernel-fixes
      with:
        version: android14-6.1
        android_version: android14
        kernel_version: "6.1"
        sublevel: ${{ steps.extract.outputs.sublevel }}
        os_patch_level: "2025-09"

    - name: Setup KernelSU-Next (rolling dev-susfs)
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        rm -rf KernelSU-Next
        curl -LSs \
          https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh \
          | bash -s dev-susfs

        ksu_repo="$PWD/KernelSU-Next"
        test -d "$ksu_repo/.git"

        # Ensure the checked-out source is the current dev-susfs tip while
        # retaining origin/dev, which KernelSU uses for its version number.
        git -C "$ksu_repo" fetch --quiet origin dev dev-susfs --tags
        git -C "$ksu_repo" checkout -B dev-susfs origin/dev-susfs

        test -L "$PWD/common/drivers/kernelsu"
        test -f "$ksu_repo/kernel/Kbuild"
        test -f "$ksu_repo/kernel/Kconfig"

        # Preserve WildKernels' original compatibility patch. It mainly
        # affects newer kernels and is harmless for this Android 14 / 6.1 build.
        static_patch="${{ github.workspace }}/.github/actions/kernelsu/patches/static.patch"
        if patch -d "$ksu_repo" -p1 --dry-run --batch < "$static_patch" >/dev/null; then
          patch -d "$ksu_repo" -p1 --batch < "$static_patch"
        elif patch -d "$ksu_repo" -R -p1 --dry-run --batch < "$static_patch" >/dev/null; then
          echo "KernelSU compatibility patch is already present"
        else
          echo "KernelSU compatibility patch no longer applies cleanly" >&2
          exit 1
        fi

        base_commit="$(git -C "$ksu_repo" merge-base HEAD origin/dev)"
        ksu_git_version="$(git -C "$ksu_repo" rev-list --count "$base_commit")"
        ksu_version="$((30000 + ksu_git_version))"
        ksu_tag="$(git -C "$ksu_repo" describe --tags --abbrev=0 "$base_commit" 2>/dev/null || echo v0.0.0)"
        ksu_commit="$(git -C "$ksu_repo" rev-parse --short HEAD)"

        echo "KSU_VERSION=$ksu_version" >> "$GITHUB_ENV"
        echo "KSU_GIT_TAG=$ksu_tag" >> "$GITHUB_ENV"
        echo "KSU_COMMIT=$ksu_commit" >> "$GITHUB_ENV"
        echo "KernelSU-Next: branch=dev-susfs commit=$ksu_commit version=$ksu_version tag=$ksu_tag"

    - name: Integrate SUSFS (rolling Android 14 / 6.1 dev)
      shell: bash
      run: |
        set -euo pipefail

        susfs_repo="${{ github.workspace }}/susfs4ksu"
        kernel_tree="${{ github.workspace }}/kernel/common"
        rm -rf "$susfs_repo"

        git clone --depth=1 --branch gki-android14-6.1-dev \
          https://gitlab.com/pershoot/susfs4ksu.git \
          "$susfs_repo"

        susfs_patch="$susfs_repo/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch"
        test -f "$susfs_patch"
        test -f "$susfs_repo/kernel_patches/fs/susfs.c"
        test -f "$susfs_repo/kernel_patches/include/linux/susfs.h"

        cp "$susfs_repo/kernel_patches/fs/"* "$kernel_tree/fs/"
        cp "$susfs_repo/kernel_patches/include/linux/"* "$kernel_tree/include/linux/"

        if patch -d "$kernel_tree" -p1 --dry-run --batch < "$susfs_patch" >/dev/null; then
          patch -d "$kernel_tree" -p1 --batch < "$susfs_patch"
        else
          echo "Current SUSFS dev patch does not apply cleanly to this kernel tree" >&2
          exit 1
        fi

        if find "$kernel_tree" -name '*.rej' -print -quit | grep -q .; then
          echo "SUSFS patch rejects were generated" >&2
          find "$kernel_tree" -name '*.rej' -print
          exit 1
        fi

        echo "SUSFS commit: $(git -C "$susfs_repo" rev-parse --short HEAD)"

    - name: Enable KernelSU and SUSFS configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y

    - name: Verify KernelSU and SUSFS integration
      shell: bash
      run: |
        set -euo pipefail

        workspace="${{ github.workspace }}"
        ksu_repo="$workspace/kernel/KernelSU-Next"
        kernel_tree="$workspace/kernel/common"
        defconfig="$kernel_tree/arch/arm64/configs/gki_defconfig"

        test "$(git -C "$ksu_repo" rev-parse --abbrev-ref HEAD)" = "dev-susfs"
        test "$(git -C "$ksu_repo" rev-parse HEAD)" = \
             "$(git -C "$ksu_repo" rev-parse origin/dev-susfs)"
        test -L "$kernel_tree/drivers/kernelsu"
        grep -Fq 'obj-$(CONFIG_KSU) += kernelsu/' "$kernel_tree/drivers/Makefile"
        grep -Fq 'source "drivers/kernelsu/Kconfig"' "$kernel_tree/drivers/Kconfig"

        test -f "$kernel_tree/include/linux/susfs.h"
        test -f "$kernel_tree/fs/susfs.c"
        grep -Fq 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' "$kernel_tree/fs/Makefile"

        for config in \
          CONFIG_KSU=y \
          CONFIG_KSU_SUSFS=y \
          CONFIG_KSU_SUSFS_SUS_PATH=y \
          CONFIG_KSU_SUSFS_SUS_MOUNT=y \
          CONFIG_KSU_SUSFS_SUS_KSTAT=y \
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y \
          CONFIG_KSU_SUSFS_ENABLE_LOG=y \
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y \
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y \
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y \
          CONFIG_KSU_SUSFS_SUS_MAP=y; do
          grep -Fqx "$config" "$defconfig" || {
            echo "Missing kernel config: $config" >&2
            exit 1
          }
        done

        echo "KernelSU dev-susfs and SUSFS integration verified before compilation"

    - name: Baseband Guard
      uses: ./.github/actions/bbg

    - name: Setup Networking
      uses: ./.github/actions/networking
      with:
        version: android14-6.1
        kernel_version: "6.1"
        android_version: android14
        sublevel: ${{ steps.extract.outputs.sublevel }}

    - name: DroidSpaces-OSS Patches
      uses: ./.github/actions/droidspaces
      with:
        version: android14-6.1
        android_version: android14
        kernel_version: "6.1"
        os_patch_level: "2025-09"
        sublevel: ${{ steps.extract.outputs.sublevel }}

    - name: Additional Server and Container Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_USER_NS=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y

    - name: Apply NTSync Patches
      uses: ./.github/actions/ntsync
      with:
        version: android14-6.1
        kernel_version: "6.1"
        sublevel: ${{ steps.extract.outputs.sublevel }}

    - name: Apply Ptrace Patch
      uses: ./.github/actions/ptrace
      with:
        kernel_version: "6.1"

    - name: Apply Unicode Fix Patch
      uses: ./.github/actions/unicode-fix
      with:
        kernel_version: "6.1"

    - name: Apply Performance Patches
      uses: ./.github/actions/performance
      if: false
      with:
        kernel_version: "6.1"

    - name: Setup Misc Configs
      uses: ./.github/actions/misc
      with:
        version: android14-6.1
        kernel_version: "6.1"
        android_version: android14
        sublevel: ${{ steps.extract.outputs.sublevel }}
        variant: TheWildJames

    - name: Apply Device-Specific Patches
      uses: ./.github/actions/apply-device-patches
      with:
        version: android14-6.1
        kernel_version: "6.1"

    - name: Apply AX88179B USB stability quirks
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import re

        path = Path("drivers/usb/core/quirks.c")
        source = path.read_text(encoding="utf-8")
        table_start = source.index(
            "static const struct usb_device_id usb_quirk_list[] = {"
        )
        table_end = source.index(
            "static const struct usb_device_id usb_interface_quirk_list[]",
            table_start,
        )
        table = source[table_start:table_end]
        pattern = re.compile(
            r"\{[^{}]*USB_DEVICE\(\s*0x([0-9a-f]{4})\s*,\s*"
            r"0x([0-9a-f]{4})\s*\)[^{}]*\},",
            re.IGNORECASE | re.DOTALL,
        )
        entries = list(pattern.finditer(table))
        target = (0x0B95, 0x1790)
        required = ("USB_QUIRK_RESET_RESUME", "USB_QUIRK_NO_LPM")
        existing = next(
            (
                entry
                for entry in entries
                if (int(entry.group(1), 16), int(entry.group(2), 16)) == target
            ),
            None,
        )

        if existing:
            if any(flag not in existing.group(0) for flag in required):
                raise SystemExit(
                    "Existing 0b95:1790 quirk does not contain both required flags"
                )
        else:
            previous = None
            for entry in entries:
                key = (int(entry.group(1), 16), int(entry.group(2), 16))
                if key < target:
                    previous = entry
                else:
                    break
            insert_at = table_start + (
                previous.end() if previous else table.index("{") + 1
            )
            addition = (
                "\n\t/* ASIX AX88179B USB 3.0 Gigabit Ethernet */\n"
                "\t{ USB_DEVICE(0x0b95, 0x1790), .driver_info =\n"
                "\t\tUSB_QUIRK_RESET_RESUME | USB_QUIRK_NO_LPM },"
            )
            source = source[:insert_at] + addition + source[insert_at:]
            path.write_text(source, encoding="utf-8")

        final = path.read_text(encoding="utf-8")
        match = re.search(
            r"\{[^{}]*USB_DEVICE\(\s*0x0b95\s*,\s*0x1790\s*\)[^{}]*\},",
            final,
            re.IGNORECASE | re.DOTALL,
        )
        if not match or any(flag not in match.group(0) for flag in required):
            raise SystemExit("AX88179B quirk verification failed")
        print(match.group(0))
        PY

    - name: Apply ABI Compare Bypass
      if: false
      working-directory: ${{ github.workspace }}/kernel
      run: |
        # ABI compare bypass per kernel/android version
        # Edit each block as needed per version
        if [[ "$ANDROID_VERSION" == "android12" && "$KERNEL_VERSION" == "5.10" ]]; then
          sed -i 's/^\s*exit 1$/    echo "Who Cares? Bypassing Now!"/' build/abi/compare_to_symbol_list
        elif [[ "$ANDROID_VERSION" == "android13" && "$KERNEL_VERSION" == "5.10" ]]; then
          sed -i 's/^\s*exit 1$/    echo "Who Cares? Bypassing Now!"/' build/kernel/abi/compare_to_symbol_list
        elif [[ "$ANDROID_VERSION" == "android13" && "$KERNEL_VERSION" == "5.15" ]]; then
          sed -i 's/^\s*exit 1$/    echo "Who Cares? Bypassing Now!"/' build/kernel/abi/compare_to_symbol_list
        elif [[ "$ANDROID_VERSION" == "android14" && "$KERNEL_VERSION" == "5.15" ]]; then
          perl -i -pe 's/^(\s*)return 1$/$1print("Who Cares? Bypassing Now!")\n$1return 0/g if /if missing_symbols:/../return 1/' build/kernel/abi/check_buildtime_symbol_protection.py
        elif [[ "$ANDROID_VERSION" == "android14" && "$KERNEL_VERSION" == "6.1" ]]; then
          perl -i -pe 's/^(\s*)return 1$/$1print("Who Cares? Bypassing Now!")\n$1return 0/g if /if missing_symbols:/../return 1/' build/kernel/abi/check_buildtime_symbol_protection.py
        elif [[ "$ANDROID_VERSION" == "android15" && "$KERNEL_VERSION" == "6.6" ]]; then
          perl -i -pe 's/^(\s*)return 1$/$1print("Who Cares? Bypassing Now!")\n$1return 0/g if /if missing_symbols:/../return 1/' build/kernel/abi/check_buildtime_symbol_protection.py
        fi

    - name: Apply Kernel Branding
      uses: ./.github/actions/apply-kernel-branding
      with:
        variant: TheWildJames
        kernel_version: "6.1"
        android_version: android14
        version: android14-6.1
        sublevel: ${{ steps.extract.outputs.sublevel }}

    - name: Remove Protected Exports
      uses: ./.github/actions/remove-protected-exports

    - name: Clean Kernel Flags
      uses: ./.github/actions/clean-kernel-flags

    - name: Scan and collect patch rejects
      id: scan
      if: ${{ always() }}
      uses: ./.github/actions/scan-patch-rejects
        
    - name: Upload Rejects
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.extract.outputs.file_name }}-Rejects
        path: patch-rejects/
        if-no-files-found: ignore
        compression-level: 9

    - name: 'Setup Cache and Build Environment'
      uses: ./.github/actions/cache-setup
      with:
        version: android14-6.1
        android_version: android14
        kernel_version: "6.1"
        sublevel: ${{ steps.extract.outputs.sublevel }}

    - name: Restore ccache
      id: restore-ccache
      continue-on-error: true
      if: false
      uses: ./.github/actions/cache-restore
      with:
        cache_path: /home/runner/.ccache
        cache_key: android14-6.1.${{ steps.extract.outputs.sublevel }}-2025-09
        cache_bucket: ccache-cache
        restore_keys: |
          android14-6.1.${{ steps.extract.outputs.sublevel }}-

    - name: Restore bazel-cache
      id: restore-bazel
      continue-on-error: true
      if: false
      uses: ./.github/actions/cache-restore
      with:
        cache_path: /home/runner/.cache/bazel
        cache_key: android14-6.1.${{ steps.extract.outputs.sublevel }}-2025-09
        cache_bucket: bazel-cache
        restore_keys: |
          android14-6.1.${{ steps.extract.outputs.sublevel }}-

    - name: Cache ccache (GitHub Native)
      uses: actions/cache@v6
      with:
        path: /home/runner/.ccache
        key: ccache-android14-6.1.${{ steps.extract.outputs.sublevel }}-2025-09
        restore-keys: |
          ccache-android14-6.1.${{ steps.extract.outputs.sublevel }}-
          ccache-android14-6.1-
          ccache-

    - name: Cache bazel-cache (GitHub Native)
      uses: actions/cache@v6
      with:
        path: /home/runner/.cache/bazel
        key: bazel-android14-6.1.${{ steps.extract.outputs.sublevel }}-2025-09
        restore-keys: |
          bazel-android14-6.1.${{ steps.extract.outputs.sublevel }}-
          bazel-android14-6.1-
          bazel-

    - name: Check cache hit
      run: |
        echo "Cache restore status:"
        CCACHE_HIT="${{ steps.restore-ccache.outputs.cache-hit || 'skipped' }}"
        BAZEL_HIT="${{ steps.restore-bazel.outputs.cache-hit || 'skipped' }}"
        echo "  ccache: $CCACHE_HIT"
        echo "  bazel: $BAZEL_HIT"

    - name: Get Cache Stats
      uses: ./.github/actions/cache-stats
      with:
        clear_stats: true

    - name: Initialize Config Fragment
      run: touch "${{ github.workspace }}/wild_gki.fragment"

    - name: Build Normal Kernel
      env:
        SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
      uses: ./.github/actions/build-kernel
      with:
        version: android14-6.1
        bypass: false

    - name: Get Cache Stats
      uses: ./.github/actions/cache-stats
      with:
        clear_stats: false

    - name: Save ccache
      continue-on-error: true
      uses: ./.github/actions/cache-save
      if: false
      with:
        cache_path: /home/runner/.ccache
        cache_key: android14-6.1.${{ steps.extract.outputs.sublevel }}-2025-09
        cache_bucket: "ccache-cache"
        compression_level: 9
        github_token: ${{ secrets.MY_GITHUB_TOKEN }}

    - name: Save bazel-cache
      continue-on-error: true
      uses: ./.github/actions/cache-save
      if: false
      with:
        cache_path: /home/runner/.cache/bazel
        cache_key: android14-6.1.${{ steps.extract.outputs.sublevel }}-2025-09
        cache_bucket: "bazel-cache"
        compression_level: 9
        github_token: ${{ secrets.MY_GITHUB_TOKEN }}

    - name: Build Bypass Kernel
      env:
        SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
      uses: ./.github/actions/build-kernel
      with:
        bypass: true
        version: android14-6.1

    - name: 📋 Consolidated Build Summary
      if: ${{ always() }}
      shell: bash
      run: |
        SUMMARY_FILE="/tmp/build-summary-${{ steps.extract.outputs.file_name }}.md"
        
        # Determine build status
        if [ "${{ job.status }}" = "success" ]; then
          STATUS="✅ Success"
        else
          STATUS="❌ Failed"
        fi
        
        # Get kernel version from Image if available
        KERNEL_VER_STR=""
        if [ -f "/home/runner/out/dist/Image" ]; then
          KERNEL_VER_STR=$(strings "/home/runner/out/dist/Image" | grep -m1 "^Linux version " | sed 's/Linux version //' || echo "")
        elif [ -f "/home/runner/out/Image" ]; then
          KERNEL_VER_STR=$(strings "/home/runner/out/Image" | grep -m1 "^Linux version " | sed 's/Linux version //' || echo "")
        fi
        
        # Get KSU version from env (set by kernelsu action)
        KSU_VER="${KSU_VERSION:-N/A}"
        KSU_TAG="${KSU_GIT_TAG:-N/A}"
        
        # Get cache stats from env (set by cache-stats action)
        CCACHE_HIT="${CCACHE_HIT_RATE:-N/A}"
        
        # Get build time (approximate from step timing)
        BUILD_TIME="N/A"
        
        # Count warnings from build log if available
        WARNINGS="N/A"
        
        {
          echo "## android14 6.1.145 (TheWildJames) — ${STATUS}"
          echo
          echo "| Metric | Value |"
          echo "|--------|-------|"
          echo "| **Status** | ${STATUS} |"
          echo "| **Kernel** | 6.1.145-android14-2025-09 |"
          if [ -n "$KERNEL_VER_STR" ]; then
            echo "| **Version String** | \`${KERNEL_VER_STR}\` |"
          fi
          echo "| **KSU Version** | ${KSU_VER} |"
          echo "| **KSU Tag** | ${KSU_TAG} |"
          echo "| **Feature Set** | KSUN+SUSFS+BBG+NET+DS |"
          echo "| **Variant** | TheWildJames |"
          echo
          
          # Kernel Fixes
          if [ -f /tmp/kernel-fixes-summary.md ]; then
            echo "### 🔧 Kernel Fixes"
            cat /tmp/kernel-fixes-summary.md
            echo
          fi
        } > "$SUMMARY_FILE"

    - name: Upload Build Summary Artifact
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.extract.outputs.file_name }}-Summary
        path: /tmp/build-summary-${{ steps.extract.outputs.file_name }}.md
        if-no-files-found: ignore
        compression-level: 9

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.extract.outputs.file_name }}-AX88179B-AnyKernel3
        path: ${{ github.workspace }}/AnyKernel3/**
        if-no-files-found: ignore
        compression-level: 9
