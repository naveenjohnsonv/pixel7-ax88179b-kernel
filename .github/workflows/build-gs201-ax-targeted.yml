name: Build GS201 AX88179B targeted kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      KERNEL_REPO: https://github.com/kerneltoast/android_kernel_google_tensynos.git
      KERNEL_COMMIT: af5c65b9547a9f33c5f566430d0434aecab5a8b5
      KERNEL_DIR: android_kernel_google_tensynos
      ANYKERNEL_REPO: https://github.com/TheWildJames/AnyKernel3.git
      ANYKERNEL_REF: sultan-gs201
      QUIRK_ARG: usbcore.quirks=0b95:1790:bk

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio dwarves flex git libelf-dev \
            libncurses-dev libssl-dev lz4 python3 rsync wget zip zstd

      - name: Download GCC 14.2.0 toolchain
        run: |
          wget -q https://www.kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0/x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz
          tar -xzf x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz

      - name: Clone Sultan kernel and AnyKernel3
        run: |
          git init "$KERNEL_DIR"
          git -C "$KERNEL_DIR" remote add origin "$KERNEL_REPO"
          git -C "$KERNEL_DIR" fetch --depth=1 origin "$KERNEL_COMMIT"
          git -C "$KERNEL_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$KERNEL_DIR" rev-parse HEAD)" = "$KERNEL_COMMIT"
          git clone --depth=1 --branch "$ANYKERNEL_REF" "$ANYKERNEL_REPO" AnyKernel3
          git -C "$KERNEL_DIR" rev-parse HEAD | tee kernel-commit.txt

      - name: Add AX88179B targeted USB quirks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android_kernel_google_tensynos/arch/arm64/configs/gs201_defconfig")
          text = path.read_text()
          quirk = "usbcore.quirks=0b95:1790:bk"

          if "CONFIG_CMDLINE_EXTEND=y" not in text:
              raise SystemExit("CONFIG_CMDLINE_EXTEND=y is missing")

          match = re.search(r'^CONFIG_CMDLINE="([^"]*)"$', text, re.MULTILINE)
          if not match:
              raise SystemExit("CONFIG_CMDLINE was not found")

          args = match.group(1).split()
          args = [arg for arg in args if not arg.startswith("usbcore.quirks=")]
          args.append(quirk)
          new_cmdline = 'CONFIG_CMDLINE="' + " ".join(args) + '"'
          text = text[:match.start()] + new_cmdline + text[match.end():]

          text, count = re.subn(
              r'^CONFIG_LOCALVERSION="[^"]*"$',
              'CONFIG_LOCALVERSION="-Sultan-AXTARGET"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("CONFIG_LOCALVERSION was not found exactly once")

          path.write_text(text)
          print(new_cmdline)
          PY

      - name: Build kernel
        env:
          CROSS: ${{ github.workspace }}/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux-
        run: |
          cd "$KERNEL_DIR"
          make CROSS_COMPILE="$CROSS" CC="${CROSS}gcc" -j"$(nproc)" gs201_defconfig
          make CROSS_COMPILE="$CROSS" CC="${CROSS}gcc" LOCALVERSION_AUTO=0 -j"$(nproc)"

      - name: Verify compiled configuration
        run: |
          cd "$KERNEL_DIR"
          grep '^CONFIG_LOCALVERSION="-Sultan-AXTARGET"$' out/.config
          grep '^CONFIG_CMDLINE=.*usbcore.quirks=0b95:1790:bk.*$' out/.config
          grep '^CONFIG_CMDLINE_EXTEND=y$' out/.config
          test -s out/arch/arm64/boot/Image.lz4
          test -n "$(find out/google-devices/gs201/dts -maxdepth 1 -name '*.dtb' -print -quit)"

      - name: Package AnyKernel3 ZIP
        run: |
          cp "$KERNEL_DIR/out/arch/arm64/boot/Image.lz4" AnyKernel3/Image.lz4
          cat "$KERNEL_DIR"/out/google-devices/gs201/dts/*.dtb > AnyKernel3/dtb
          cp "$KERNEL_DIR/out/.config" config-ax-targeted.txt
          ZIP=gs201-a16-sultan-ax-targeted-anykernel3.zip
          (cd AnyKernel3 && zip -r9 "../$ZIP" ./*)
          sha256sum "$ZIP" > "$ZIP.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gs201-ax-targeted
          if-no-files-found: error
          retention-days: 14
          path: |
            gs201-a16-sultan-ax-targeted-anykernel3.zip
            gs201-a16-sultan-ax-targeted-anykernel3.zip.sha256
            config-ax-targeted.txt
            kernel-commit.txt
